<!DOCTYPE html>
<html lang="en">
<head>
<base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Development | Cabot Residential</title>
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/png" sizes="32x32" href="https://www.cabotresidentialboston.com/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="https://www.cabotresidentialboston.com/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="64x64" href="https://www.cabotresidentialboston.com/favicon-64x64.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://www.cabotresidentialboston.com/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe.min.css">

<style>
  :root{
    --ink:#231F1C;
    --ink-soft:#4A443E;
    --paper:#FFFFFF;
    --paper-alt:#F5F3F1;
    --paper-alt-2:#EFE9E1;
    --stone:#9C948A;
    --stone-dark:#6E655C;
    --hairline:rgba(35,31,28,.10);
    --brass:#C46A4A;
    --brass-dark:#A6543A;
    --white:#FFFFFF;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 20px 44px -24px rgba(35,31,28,.22);
    --ease:cubic-bezier(.16,.8,.24,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    padding-top:85px;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;}

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-size:11px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    font-weight:500;
    color:var(--stone-dark);
    display:inline-flex; align-items:center; gap:12px;
  }
  .eyebrow::before{
    content:''; width:22px; height:1px; background:var(--stone-dark); flex-shrink:0;
  }

  h1,h2,h3{
    font-family:'Bricolage Grotesque', sans-serif;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
  }

  .divider{
    border:none;
    border-top:1px solid var(--hairline);
    margin:0;
  }

  /* ---------- Nav (matches index.html) ---------- */
  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:200;
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 56px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--hairline);
  }
  @media(max-width:860px){ header.nav{ padding:22px 24px; } }
  @media(max-width:860px){ body{ padding-top:93px; } }
  .logo{ display:flex; align-items:center; }
  .logo img{ height:48px; width:auto; display:block; }
  .logo-fallback{
    font-family:'Bricolage Grotesque', sans-serif; font-size:17px; letter-spacing:0.01em; color:var(--ink); font-weight:700;
  }
  nav.links{ display:flex; gap:42px; margin-left:auto; }
  nav.links a{
    font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft);
    position:relative; padding-bottom:3px; transition:color .3s ease;
  }
  nav.links a::after{
    content:''; position:absolute; left:0; bottom:0; width:0; height:1px; background:var(--ink);
    transition:width 0.35s ease;
  }
  nav.links a:hover::after{ width:100%; }
  nav.links a:hover{ color:var(--ink); }

  /* ---------- Hamburger ---------- */
  .hamburger{
    display:none; position:relative; width:26px; height:14px;
    background:none; border:none; padding:0; cursor:pointer; z-index:210;
  }
  .hamburger span{
    position:absolute; right:0; height:1.5px; background:var(--ink);
    transition:width 0.4s cubic-bezier(.16,1,.3,1), transform 0.45s cubic-bezier(.16,1,.3,1), top 0.45s cubic-bezier(.16,1,.3,1);
  }
  .hamburger span:nth-child(1){ top:0; left:0; width:100%; }
  .hamburger span:nth-child(2){ top:100%; width:60%; transform:translateY(-100%); }
  .hamburger.open span:nth-child(1){ top:50%; width:100%; transform:translateY(-50%) rotate(45deg); }
  .hamburger.open span:nth-child(2){ top:50%; width:100%; transform:translateY(-50%) rotate(-45deg); }

  .mobile-menu{
    position:fixed; inset:0; z-index:150;
    background:rgba(252,250,246,0.98); backdrop-filter:blur(18px);
    display:flex; flex-direction:column; justify-content:center;
    padding:32px;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 0.5s cubic-bezier(.16,1,.3,1), visibility 0s linear 0.5s;
  }
  .mobile-menu.open{
    opacity:1; visibility:visible; pointer-events:auto;
    transition:opacity 0.5s cubic-bezier(.16,1,.3,1), visibility 0s linear 0s;
  }
  .mobile-menu a{
    font-family:'Bricolage Grotesque', sans-serif; font-size:clamp(30px,9vw,44px); font-weight:600;
    color:var(--ink); padding:12px 0; border-bottom:1px solid var(--hairline);
    opacity:0; transform:translateY(16px);
    transition:opacity 0.5s cubic-bezier(.16,1,.3,1), transform 0.5s cubic-bezier(.16,1,.3,1);
  }
  .mobile-menu.open a{ opacity:1; transform:translateY(0); }
  .mobile-menu.open a:nth-child(1){ transition-delay:0.08s; }
  .mobile-menu.open a:nth-child(2){ transition-delay:0.14s; }
  .mobile-menu.open a:nth-child(3){ transition-delay:0.2s; }
  .mobile-menu.open a:nth-child(4){ transition-delay:0.26s; }

  @media(max-width:860px){
    nav.links{ display:none; }
    .hamburger{ display:block; }
  }

  /* ---------- Footer (matches index.html) ---------- */
  footer{ border-top:1px solid var(--hairline); padding:52px 0; background:var(--paper); }
  footer .wrap{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:24px; }
  footer .flogo{ font-family:'Bricolage Grotesque', sans-serif; font-size:16px; display:flex; align-items:center; gap:9px; font-weight:700; }
  footer .flogo img{ height:46px; width:auto; display:block; flex-shrink:0; }
  footer nav{ display:flex; gap:30px; }
  footer nav a{ font-size:12px; letter-spacing:.02em; color:var(--stone-dark); }
  footer nav a:hover{ color:var(--ink); }
  footer .meta{ font-size:11.5px; color:var(--stone); text-align:right; line-height:1.6; }
  @media(max-width:760px){ footer .wrap{flex-direction:column; align-items:flex-start;} footer .meta{text-align:left;} }

  /* ---------- Listing top: back link + title row ---------- */
  .listing-top{
    padding:28px 32px 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    letter-spacing:0.02em;
    font-weight:500;
    color:var(--stone-dark);
    transition:color .2s var(--ease), gap .2s var(--ease);
  }
  .back-link:hover{ color:var(--brass); gap:9px; }
  .back-link svg{ width:13px; height:13px; }

  .title-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:24px;
    margin-top:22px;
  }
  .title-row h1{
    font-size:clamp(1.9rem, 3.4vw, 2.75rem);
    line-height:1.08;
  }
  .status-pill{
    flex:none;
    display:inline-flex;
    align-items:center;
    gap:7px;
    font-size:10.5px;
    font-weight:500;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-family:'Jost', sans-serif;
    color:var(--stone-dark);
    background:var(--paper-alt);
    border:none;
    padding:8px 14px;
    border-radius:999px;
    margin-top:6px;
    white-space:nowrap;
  }
  .status-pill .dot{ width:6px;height:6px;border-radius:50%;background:var(--brass); }

  .listing-address{
    margin-top:10px;
    font-size:15px;
    font-weight:300;
    color:var(--stone-dark);
  }

  /* ---------- Reveal ---------- */
  .reveal{ opacity:0; transform:translateY(20px); transition:opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in{ opacity:1; transform:translateY(0); }

  /* ---------- Bento Gallery ---------- */
  .gallery-section{ padding: 28px 32px; }
  .bento{
    display:grid;
    gap:8px;
    border-radius:var(--radius-lg);
    overflow:hidden;
    position:relative;
    background:var(--paper-alt);
  }
  .bento-tile{
    position:relative;
    overflow:hidden;
    background:var(--paper-alt);
    cursor:zoom-in;
    border:0;
    padding:0;
    display:block;
    width:100%;
    height:100%;
  }
  .bento-tile img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position: top;
    transform:scale(1);
    transition:transform .7s var(--ease);
  }
  .bento-tile:hover img{ transform:scale(1.045); }
  .bento-tile::after{
    content:"";
    position:absolute; inset:0;
    background:rgba(23,24,26,0);
    transition:background .3s var(--ease);
  }
  .bento-tile:hover::after{ background:rgba(23,24,26,.05); }

  /* single photo — natural ratio, never cropped */
  .bento[data-count="1"]{ grid-template-columns:1fr; background:transparent; border-radius:var(--radius-lg); }
  .bento[data-count="1"] .bento-tile{ height:auto; display:flex; justify-content:center; }
  .bento[data-count="1"] .bento-tile.img-fallback{ height:280px; width:100%; }
  .bento[data-count="1"] img{
    width:auto; height:auto;
    max-width:100%; max-height:78vh;
    object-fit:contain;
    margin:0 auto;
  }

  .bento[data-count="2"]{
    grid-template-columns:1fr 1fr;
    height:clamp(300px, 36vw, 460px);
  }

  .bento[data-count="3"]{
    grid-template-columns:1.4fr 1fr;
    grid-template-rows:1fr 1fr;
    height:clamp(320px, 40vw, 500px);
  }
  .bento[data-count="3"] .bento-tile:nth-child(1){ grid-column:1; grid-row:1 / 3; }

  .bento[data-count="4"]{
    grid-template-columns:1.4fr 1fr;
    grid-template-rows:repeat(3, 1fr);
    height:clamp(340px, 42vw, 540px);
  }
  .bento[data-count="4"] .bento-tile:nth-child(1){ grid-column:1; grid-row:1 / 4; }

  .bento[data-count="5"]{
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(2, 1fr);
    height:clamp(340px, 42vw, 540px);
  }
  .bento[data-count="5"] .bento-tile:nth-child(1){ grid-column:1 / 3; grid-row:1 / 3; }

  .show-all-btn{
    position:absolute;
    right:14px;
    bottom:14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--white);
    color:var(--ink);
    font-size:12px;
    letter-spacing:0.04em;
    font-weight:500;
    font-family:'Jost', sans-serif;
    padding:10px 16px;
    border-radius:var(--radius-sm);
    border:1px solid var(--hairline);
    box-shadow:0 2px 6px rgba(35,31,28,.12);
    cursor:pointer;
    z-index:2;
    transition:background .3s ease;
  }
  .show-all-btn svg{ width:15px; height:15px; }
  .show-all-btn:hover{ background:var(--paper-alt); }

  @media (max-width:760px){
    .bento[data-count="3"],
    .bento[data-count="4"],
    .bento[data-count="5"]{
      grid-template-columns:1fr 1fr;
      grid-template-rows:none;
      height:auto;
    }
    .bento[data-count="3"] .bento-tile:nth-child(1),
    .bento[data-count="4"] .bento-tile:nth-child(1),
    .bento[data-count="5"] .bento-tile:nth-child(1){
      grid-column:1 / 3;
      grid-row:auto;
      aspect-ratio:4 / 5;
    }
    .bento[data-count="3"] .bento-tile:not(:nth-child(1)),
    .bento[data-count="4"] .bento-tile:not(:nth-child(1)),
    .bento[data-count="5"] .bento-tile:not(:nth-child(1)){
      grid-column:auto;
      grid-row:auto;
      aspect-ratio:1 / 1;
    }
  }

  /* ---------- Info section ---------- */
  .info{
    padding:72px 0;
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:80px;
  }
  .info-overview .eyebrow{ margin-bottom:18px; display:block; }
  .info-overview h2{
    font-size:26px;
    margin-bottom:18px;
  }
  .info-overview p{
    font-size:16px;
    font-weight:300;
    line-height:1.75;
    color:var(--stone-dark);
    max-width:56ch;
    white-space:pre-line;
  }

  .specs-card{
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding:32px 28px;
    background: var(--white);
  }
  .specs-card .eyebrow{ display:block; margin-bottom:6px; }
  .specs-list{
    list-style:none;
    margin:14px 0 0;
    padding:0;
  }
  .specs-list li{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:14px 0;
    border-bottom:1px solid var(--hairline);
    font-size:14.5px;
    font-family:'Bricolage Grotesque', sans-serif;
  }
  .specs-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .specs-list .label{ color:var(--stone-dark); font-weight:400; }
  .specs-list .value{ font-weight:600; text-align:right; color:var(--ink); }

  @media (max-width:900px){
    .info{ grid-template-columns:1fr; gap:36px; padding:56px 0; }
  }

  /* ---------- Map ---------- */
  .map-section{ padding:0 0 100px; }
  .map-section .eyebrow{ display:block; margin-bottom:22px; }
  .map-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/7;
    border:1px solid var(--hairline);
    border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .map-frame iframe{ width:100%; height:100%; border:0; }
  .map-address{
    margin-top:16px;
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--stone-dark);
  }
  @media (max-width:700px){ .map-frame{ aspect-ratio:4/5; } }

  .state-msg{
    padding:140px 32px;
    text-align:center;
    color:var(--stone-dark);
    font-size:15px;
    font-weight:300;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>

<script type="module">
import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe-lightbox.esm.min.js';

const specLabels = {
  type: 'Type',
  year: 'Year',
  residences: 'Residences',
  bedrooms: 'Bedrooms',
  bathrooms: 'Bathrooms',
  livingArea: 'Living Area'
};

function titleize(key){
  return key.replace(/([A-Z])/g,' $1').replace(/^./, c => c.toUpperCase());
}

function has(v){
  return v !== null && v !== undefined && v !== '';
}

function buildAddress(addr){
  if(!addr) return { full:'' };
  const line1 = addr.street || '';
  const line2Parts = [addr.city, addr.state].filter(has).join(', ');
  const line2 = [line2Parts, addr.zip].filter(has).join(' ');
  const full = [line1, line2].filter(has).join(', ');
  return { full };
}

function preloadImage(src){
  return new Promise((resolve) => {
    const img = new Image();
    const fullSrc = src;

    img.onload = () => resolve({ src: fullSrc, w: img.naturalWidth || 1600, h: img.naturalHeight || 1200 });
    img.onerror = () => resolve({ src: fullSrc, w: 1600, h: 1200 });
    img.src = fullSrc;
  });
}

async function init() {
    const app = document.getElementById("app");

    const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
    console.log(location.pathname);

    if (!slug) {
        app.innerHTML = "<div class='state-msg'>No development selected.</div>";
        return;
    }

    try {
        const res = await fetch("/projects.json", { cache: "no-store" });
        const projects = await res.json();

        const project = projects.find(p => p.id === slug);

        if (!project) {
            app.innerHTML = "<div class='state-msg'>Development not found.</div>";
            return;
        }

        render(app, project);

    } catch (err) {
        app.innerHTML = "<div class='state-msg'>Couldn't load projects.</div>";
        console.error(err);
    }
}

function render(app, data){
  const photos = Array.isArray(data.photos) ? data.photos : [];
  const addr = buildAddress(data.address);

  if(has(data.title)) document.title = data.title + ' | Cabot Residential';

  // Update meta description, canonical, and social tags for this project
  // so each development gets its own descriptive summary and share preview.
  const pageUrl = 'https://www.cabotresidentialboston.com/project.html#' + encodeURIComponent(data.id || '');
  const metaDesc = has(data.overview)
    ? data.overview
    : ('A Cabot Residential development' + (addr.full ? ' at ' + addr.full : '') + ' in South Boston, MA.');
  const shareTitle = (has(data.title) ? data.title : 'Development') + ' | Cabot Residential';
  const shareImage = photos.length ? photos[0] : 'https://www.cabotresidentialboston.com/hero-bg.webp';

  const setMeta = (selector, attr, value) => {
    const el = document.querySelector(selector);
    if (el) el.setAttribute(attr, value);
  };
  setMeta('meta[name="description"]', 'content', metaDesc);
  setMeta('link[rel="canonical"]', 'href', pageUrl);
  setMeta('meta[property="og:title"]', 'content', shareTitle);
  setMeta('meta[property="og:description"]', 'content', metaDesc);
  setMeta('meta[property="og:url"]', 'content', pageUrl);
  setMeta('meta[property="og:image"]', 'content', shareImage);
  setMeta('meta[name="twitter:title"]', 'content', shareTitle);
  setMeta('meta[name="twitter:description"]', 'content', metaDesc);
  setMeta('meta[name="twitter:image"]', 'content', shareImage);

  // Breadcrumb structured data: Home > Developments > this project
  if (has(data.title)) {
    const existingLd = document.getElementById('breadcrumbLd');
    if (existingLd) existingLd.remove();
    const ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.id = 'breadcrumbLd';
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://www.cabotresidentialboston.com/" },
        { "@type": "ListItem", "position": 2, "name": "Developments", "item": "https://www.cabotresidentialboston.com/developments.html" },
        { "@type": "ListItem", "position": 3, "name": data.title, "item": pageUrl }
      ]
    });
    document.head.appendChild(ld);
  }

  app.innerHTML = '';

  // ---------- Listing top ----------
  const top = document.createElement('div');
  top.className = 'wrap listing-top';

  const back = document.createElement('a');
  back.className = 'back-link';
  back.href = 'javascript:history.back()';
  back.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M19 12H5M11 18l-6-6 6-6"/></svg> All Developments';
  top.appendChild(back);

  const titleRow = document.createElement('div');
  titleRow.className = 'title-row';
  const h1 = document.createElement('h1');
  h1.textContent = has(data.title) ? data.title : '';
  titleRow.appendChild(h1);

  if(has(data.status)){
    const pill = document.createElement('div');
    pill.className = 'status-pill';
    pill.innerHTML = '<span class="dot"></span><span></span>';
    pill.querySelector('span:last-child').textContent = data.status;
    titleRow.appendChild(pill);
  }
  top.appendChild(titleRow);

  if(addr.full){
    const addrEl = document.createElement('div');
    addrEl.className = 'listing-address';
    addrEl.textContent = addr.full;
    top.appendChild(addrEl);
  }
  app.appendChild(top);

  // ---------- Bento Gallery ----------
  if(photos.length){
    const gallerySection = document.createElement('div');
    gallerySection.className = 'wrap gallery-section reveal';

    const visibleCount = Math.min(photos.length, 5);
    const bento = document.createElement('div');
    bento.className = 'bento';
    bento.dataset.count = String(visibleCount);

    for(let i = 0; i < visibleCount; i++){
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'bento-tile';
      tile.setAttribute('aria-label', 'Open photo ' + (i + 1));

      const img = document.createElement('img');
      img.src = photos[i];
      img.loading = i === 0 ? 'eager' : 'lazy';
      img.alt = (has(data.title) ? data.title : 'Photo') + ' ' + (i + 1);
      img.onerror = function(){ this.closest('.bento-tile').classList.add('img-fallback'); this.remove(); };
      tile.appendChild(img);

      if(i === visibleCount - 1 && photos.length > visibleCount){
        const btn = document.createElement('span');
        btn.className = 'show-all-btn';
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Show all ' + photos.length + ' photos</span>';
        tile.appendChild(btn);
      }

      bento.appendChild(tile);
    }

    gallerySection.appendChild(bento);
    app.appendChild(gallerySection);

    // Preload all photos (full set) for lightbox dataSource, wire up click-to-index
    preloadAllAndBindLightbox(photos, bento);
  }

  // ---------- Info ----------
  const infoWrap = document.createElement('div');
  infoWrap.className = 'wrap';
  const info = document.createElement('section');
  info.className = 'info reveal';

  const overviewCol = document.createElement('div');
  overviewCol.className = 'info-overview';
  if(has(data.overview)){
    const eyebrow = document.createElement('span');
    eyebrow.className = 'eyebrow';
    eyebrow.textContent = 'Overview';
    overviewCol.appendChild(eyebrow);
    const h2 = document.createElement('h2');
    h2.textContent = 'About this development';
    overviewCol.appendChild(h2);
    const p = document.createElement('p');
    p.textContent = data.overview;
    overviewCol.appendChild(p);
  }
  info.appendChild(overviewCol);

  const specs = data.specs || {};
  const specEntries = Object.keys(specLabels)
    .filter(k => has(specs[k]))
    .map(k => [specLabels[k], specs[k]]);
  Object.keys(specs).forEach(k => {
    if(!specLabels[k] && has(specs[k])) specEntries.push([titleize(k), specs[k]]);
  });

  if(specEntries.length){
    const card = document.createElement('aside');
    card.className = 'specs-card';
    const eyebrow = document.createElement('span');
    eyebrow.className = 'eyebrow';
    eyebrow.textContent = 'Details';
    card.appendChild(eyebrow);
    const ul = document.createElement('ul');
    ul.className = 'specs-list';
    specEntries.forEach(([label, value]) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="label"></span><span class="value"></span>';
      li.querySelector('.label').textContent = label;
      li.querySelector('.value').textContent = value;
      ul.appendChild(li);
    });
    card.appendChild(ul);
    info.appendChild(card);
  }

  if(overviewCol.children.length || specEntries.length){
    infoWrap.appendChild(info);
    if(photos.length){
      const hr = document.createElement('hr');
      hr.className = 'divider';
      const hrWrap = document.createElement('div');
      hrWrap.className = 'wrap';
      hrWrap.appendChild(hr);
      app.appendChild(hrWrap);
    }
    app.appendChild(infoWrap);
  }

  // ---------- Map ----------
  if(addr.full){
    const hrWrap = document.createElement('div');
    hrWrap.className = 'wrap';
    const hr = document.createElement('hr');
    hr.className = 'divider';
    hrWrap.appendChild(hr);
    app.appendChild(hrWrap);

    const mapWrap = document.createElement('div');
    mapWrap.className = 'wrap';
    const mapSection = document.createElement('section');
    mapSection.className = 'map-section reveal';
    mapSection.style.paddingTop = '56px';
    const eyebrow = document.createElement('span');
    eyebrow.className = 'eyebrow';
    eyebrow.textContent = 'Location';
    mapSection.appendChild(eyebrow);

    const frame = document.createElement('div');
    frame.className = 'map-frame';
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.google.com/maps?q=${data.location.lat},${data.location.lng}&output=embed`;
    iframe.loading = 'lazy';
    iframe.allowFullscreen = true;
    frame.appendChild(iframe);
    mapSection.appendChild(frame);

    const addrText = document.createElement('p');
    addrText.className = 'map-address';
    addrText.textContent = addr.full;
    mapSection.appendChild(addrText);

    mapWrap.appendChild(mapSection);
    app.appendChild(mapWrap);
  }

  // ---------- Reveal on scroll ----------
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('in'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
}

async function preloadAllAndBindLightbox(photos, bento){
  const dataSource = await Promise.all(photos.map(preloadImage));

  const lightbox = new PhotoSwipeLightbox({
    dataSource,
    pswpModule: () => import('https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe.esm.min.js'),
    bgOpacity: 0.95,
    showHideAnimationType: 'fade'
  });
  lightbox.init();

  const tiles = bento.querySelectorAll('.bento-tile');
  tiles.forEach((tile, i) => {
    tile.addEventListener('click', () => lightbox.loadAndOpen(i));
  });
}

init();

// hamburger menu (mobile) — matches index.html
const hamburger = document.getElementById('hamburgerBtn');
const mobileMenu = document.getElementById('mobileMenu');
function closeMobileMenu(){
  hamburger.classList.remove('open');
  mobileMenu.classList.remove('open');
  hamburger.setAttribute('aria-expanded', 'false');
  document.body.style.overflow = '';
}
hamburger.addEventListener('click', () => {
  const isOpen = !hamburger.classList.contains('open');
  hamburger.classList.toggle('open', isOpen);
  mobileMenu.classList.toggle('open', isOpen);
  hamburger.setAttribute('aria-expanded', String(isOpen));
  document.body.style.overflow = isOpen ? 'hidden' : '';
});
mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMobileMenu));
</script>
