name = "cabot-admin"
main = "worker.js"
compatibility_date = "2024-11-01"

# Secrets (set these with `wrangler secret put NAME` — never written to this file):
#   ADMIN_PASSWORD     the password the admin panel logs in with
#   GITHUB_TOKEN        a GitHub personal access token with repo access
#   GITHUB_OWNER         e.g. "cabot-residential"
#   GITHUB_REPO          e.g. "cabot-website"
#   GITHUB_BRANCH        e.g. "main"
#   GITHUB_FILE_PATH     e.g. "projects.json"
#   CF_ACCOUNT_ID        your Cloudflare account ID
#   CF_IMAGES_TOKEN      an API token with "Cloudflare Images: Edit" permission
